name: Sync GitHub stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-github-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # repo_stars_recent diffs against the repo_stars committed 14 days ago,
      # so pull enough history past the default depth-1 clone to reach it.
      - name: Fetch recent history
        run: git fetch --shallow-since="$(date -u -d '21 days ago' +%F)" origin "${{ github.ref_name }}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync GitHub stats
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/sync-github-stats.ts

      # The README's star column comes from the same frontmatter. A push made
      # with GITHUB_TOKEN doesn't trigger update-readme.yml, so regenerate it
      # here and ship it in the same commit.
      - name: Regenerate README
        working-directory: frontend
        run: npx tsx scripts/generate-readme.ts

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- frontend/src/content/tools README.md; then
            echo "No GitHub stats changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/content/tools README.md
          git commit -m "Sync GitHub stats (stars, last updated, latest release, badge)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
