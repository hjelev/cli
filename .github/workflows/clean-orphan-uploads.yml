name: Clean orphaned uploads

# Edits that replace an uploaded logo/media with a URL (or a re-upload with a
# different extension, or a removed listing) leave the old file in
# frontend/public/uploads/. After each merge to master, delete any upload no
# longer referenced from src/ and commit the removal.
on:
  push:
    branches: [master]
    paths:
      - 'frontend/src/content/tools/**/*.md'
      - 'frontend/public/uploads/**'
  workflow_dispatch:

permissions:
  contents: write

# update-readme.yml runs on the same trigger and also pushes; serialize our
# own runs and rebase before pushing so neither clobbers the other.
concurrency:
  group: clean-orphan-uploads
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Delete orphaned uploads
        working-directory: frontend
        run: npx tsx scripts/clean-orphan-uploads.ts --delete

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- frontend/public/uploads)" ]; then
            echo "No orphaned uploads."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A frontend/public/uploads
          git commit -m "Remove orphaned uploads"
          git pull --rebase
          git push
